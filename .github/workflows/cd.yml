name: CD - Acceptance y Blue-Green

on:
  pull_request:
    branches:
      - develop

  workflow_dispatch:

jobs:

  build:
    name: Build de aplicacion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar aplicacion
        run: mvn -B clean package

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion
          path: target/examen-automatizacion-pruebas-1.0.0.jar


  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: aplicacion
          path: target

      - name: Iniciar ambiente de pruebas
        run: |
          java -jar target/examen-automatizacion-pruebas-1.0.0.jar \
            --server.port=8080 > application.log 2>&1 &
          echo $! > application.pid

      - name: Esperar disponibilidad
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/api/tareas > /dev/null 2>&1; then
              echo "Aplicacion disponible en puerto 8080"
              exit 0
            fi
            sleep 2
          done

          echo "ERROR: La aplicacion no respondio"
          cat application.log
          exit 1

      - name: Ejecutar Acceptance Tests
        run: |
          bash deployment/scripts/acceptance-test.sh \
            http://localhost:8080

      - name: Detener ambiente de pruebas
        if: always()
        run: |
          if [ -f application.pid ]; then
            kill $(cat application.pid) 2>/dev/null || true
          fi


  deployment:
    name: Blue-Green y Rollback
    runs-on: ubuntu-latest
    needs: acceptance

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: aplicacion
          path: target

      - name: Ejecutar despliegue Blue-Green
        run: |
          bash deployment/scripts/blue-green-deploy.sh \
            target/examen-automatizacion-pruebas-1.0.0.jar